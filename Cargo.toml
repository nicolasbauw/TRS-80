[workspace]
members = ["core"]

# `cargo build`/`cargo run` without `-p` act on the workspace default
# members - this root package (the desktop app) plus `core` - but only this
# one defines a binary, so plain `cargo run` still does the expected thing.

[package]
name = "trust-80"
version = "2.0.0"
edition = "2021"
authors = ["Nicolas BAUW <nbauw@hotmail.com>"]
description = "TRS-80 Emulator"
keywords = ["emulation", "emulator", "TRS-80", "Z80"]
categories = ["emulators"]
license = "MIT"
repository = "https://github.com/nicolasbauw/TRS-80"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
trust-80-core = { path = "core" }
zilog_silicon = { git = "ssh://git@github.com/nicolasbauw/zilog_silicon.git", branch = "master", default-features = false }
egui = "0.33.3"
image = { version = "0.25", default-features = false, features = ["png"] }
toml = "0.7.0"
serde = "1.0.145"
serde_derive = "1.0.145"
directories = "4.0"
fs_extra = "1.2.0"

[dependencies.sdl2]
version = "0.38.0"

[build-dependencies]
directories = "4.0"
fs_extra = "1.2.0"
