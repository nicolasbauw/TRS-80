[package]
name = "trust-80"
version = "2.0.0"
edition = "2021"
authors = ["Nicolas BAUW <nbauw@hotmail.com>"]
description = "TRS-80 Emulator"
keywords = ["emulation", "emulator", "TRS-80", "Z80"]
categories = ["emulators"]
license = "MIT"
repository = "https://github.com/nicolasbauw/TRS-80"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
zilog_z80 = "1.1.2"
zilog_silicon = { path = "../zilog_silicon", default-features = false }
egui = "0.33.3"
image = { version = "0.25", default-features = false, features = ["png"] }
toml = "0.7.0"
serde = "1.0.145"
serde_derive = "1.0.145"
directories = "4.0"
fs_extra = "1.2.0"

[dependencies.sdl2]
version = "0.38.0"

[build-dependencies]
directories = "4.0"
fs_extra = "1.2.0"

# Only examples/gen_charset.rs (a one-time asset-generation tool, not part
# of the shipped app) needs SDL_ttf/FreeType - keeping that dependency out
# of the main binary was the whole point of switching to charset.rs.
[dev-dependencies.sdl2]
version = "0.38.0"
features = ["ttf"]